server:
  port: 8080

spring:
  application:
    name: tax-gap-service
  datasource:
    # createDatabaseIfNotExist=true auto-creates the `taxgap` schema on first run
    url: jdbc:mysql://localhost:3306/taxgap?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:taxgap_user}
    password: ${DB_PASSWORD:taxgap_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

logging:
  level:
    com.taxgap: INFO
