server.port=8080

spring.application.name=tax-gap-service

# createDatabaseIfNotExist=true auto-creates the `taxgap` schema on first run
spring.datasource.url=jdbc:mysql://localhost:3306/taxgap?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=madhav
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

logging.level.com.taxgap=INFO
